name: Diagnose provider-specific currency results
on:
  push:
    branches: [diagnose-currency-results]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compare production searches
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          from urllib.parse import urlencode
          cases=[('2026-10-15',['tarco','badr','sudanair'],'SDG'),('2026-10-22',['tarco'],'USD'),('2026-10-22',['tarco'],'SDG')]
          for date,airlines,currency in cases:
              query=urlencode({'from':'PZU','to':'CAI','date':date,'passengers':1,'trip':'oneway','airline':airlines,'currency':currency},doseq=True)
              try:
                  with urllib.request.urlopen('https://rihla-flights.vercel.app/api/search?'+query,timeout=100) as r:
                      data=json.load(r)
                      print('PRODUCTION_PROBE '+json.dumps({'date':date,'currency':currency,'status':r.status,'data':data}),flush=True)
              except urllib.error.HTTPError as error:
                  print('PRODUCTION_PROBE '+json.dumps({'date':date,'currency':currency,'status':error.code,'body':error.read(3000).decode()}),flush=True)
              except Exception as error:
                  print('PRODUCTION_PROBE '+json.dumps({'date':date,'currency':currency,'error':type(error).__name__}),flush=True)
          PY
