name: Inspect booking sources with CloakBrowser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloakbrowser-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install CloakBrowser
        run: python3 -m pip install --quiet --disable-pip-version-check cloakbrowser==0.6.2
      - name: Install official signed Chromium
        run: python3 -m cloakbrowser install
      - name: Inspect booking pages with CloakBrowser
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          from cloakbrowser import launch
          from urllib.parse import urlsplit
          def scrub(s):
           return re.sub(r'\(S\([^)]*\)\)', '(S([redacted]))',s)
          browser=launch(headless=True)
          try:
           page=browser.new_page(locale="en-GB")
           r=page.goto("https://fo-emea.ttinteractive.com/Zenith/FrontOffice/tarcoair/en-GB",wait_until="domcontentloaded",timeout=45000)
           page.wait_for_timeout(5000)
           info=page.evaluate("""() => ({
           title:document.title,text:document.body.innerText.slice(0,2500),
           inputs:Array.from(document.querySelectorAll('input:not([type=hidden])'),e=>e.outerHTML),
           appRoots:Array.from(document.querySelectorAll('*')).filter(e=>e.__vue_app__).map(e=>({tag:e.tagName,id:e.id,keys:Object.keys(e.__vue_app__._instance?.proxy||{})})),
           snippets:Array.from(document.scripts).filter(s=>!s.src).flatMap(s=>{
            const text=s.textContent;return ['SearchResult','searchFlights','searchFlight','originInput','departureAirportCode','createApp'].map(k=>{const i=text.indexOf(k);return i<0?null:{marker:k,text:text.slice(Math.max(0,i-1000),i+4500)}}).filter(Boolean)
           })
          })""")
           info["status"]=r.status
           print("INSPECTION_JSON "+scrub(json.dumps(info)),flush=True)
          finally:browser.close()
          
          PY
      - name: Save inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloakbrowser-source-inspection
          path: cloak-inspection
          retention-days: 1
