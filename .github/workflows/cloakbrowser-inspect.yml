name: Inspect booking sources with CloakBrowser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloakbrowser-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install CloakBrowser
        run: python3 -m pip install --quiet --disable-pip-version-check cloakbrowser==0.6.2
      - name: Install official signed Chromium
        run: python3 -m cloakbrowser install
      - name: Inspect booking pages with CloakBrowser
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from urllib.parse import urlencode,urlsplit
          from cloakbrowser import launch
          def scrub(s):return re.sub(r'\(S\([^)]*\)\)', '(S([redacted]))',s)
          bases={"tarco":"https://fo-emea.ttinteractive.com/Zenith/FrontOffice/tarcoair/en-GB","badr":"https://fo-emea.ttinteractive.com/Zenith/FrontOffice/badrairlines/en-GB","sudanair":"https://emea.ttinteractive.com/Zenith/FrontOffice/SudanAirways/en-GB"}
          params={"OriginAirportCode":"PZU","DestinationAirportCode":"CAI","OutboundDate":"2026-10-21","TravelerTypes[0].Key":"AD","TravelerTypes[0].Value":"1","TravelerTypes[1].Key":"CHD","TravelerTypes[1].Value":"0","TravelerTypes[2].Key":"INF","TravelerTypes[2].Value":"0","Currency":"USD","mode":"iframe"}
          browser=launch(headless=True)
          try:
           for name,base in bases.items():
            context=browser.new_context(locale="en-GB")
            page=context.new_page()
            url=base+"/BookingEngine/SearchResult?"+urlencode(params)
            try:
             response=page.goto(url,wait_until="domcontentloaded",timeout=60000)
             page.wait_for_timeout(12000)
             print("DEEP_LINK_JSON "+scrub(json.dumps({"source":name,"status":response.status,"title":page.title(),"path":urlsplit(page.url).path,"text":page.locator("body").inner_text()[:15000],"xframe":response.header_value("x-frame-options"),"csp":response.header_value("content-security-policy")})),flush=True)
             framepage=context.new_page()
             framepage.set_content("<iframe title='results' style='width:100%;height:1400px'></iframe>")
             framepage.locator("iframe").evaluate("(e,u)=>e.src=u",url)
             framepage.wait_for_timeout(10000)
             frame=framepage.frames[-1]
             print("EMBED_JSON "+scrub(json.dumps({"source":name,"title":frame.title(),"text":frame.locator("body").inner_text()[:15000]})),flush=True)
            except Exception as exc:
             print("DEEP_LINK_JSON "+scrub(json.dumps({"source":name,"error":type(exc).__name__,"message":str(exc)[:700]})),flush=True)
            finally:context.close()
          finally:browser.close()
          
          PY
      - name: Save inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloakbrowser-source-inspection
          path: cloak-inspection
          retention-days: 1
