name: Inspect airline booking sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-airline-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public booking pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, pathlib, concurrent.futures
          from html.parser import HTMLParser
          root=pathlib.Path('source-inspection'); root.mkdir()
          sources={'tarco':'https://fo-emea.ttinteractive.com/zenith/frontoffice/tarcoair/en-GB/BookingEngine/SearchFlights','badr':'https://fo-emea.ttinteractive.com/Zenith/FrontOffice/badrairlines/en-GB/BookingEngine/SearchFlights','sudanair':'https://emea.ttinteractive.com/Zenith/FrontOffice/SudanAirways/en-GB/BookingEngine/SearchFlights'}
          class Parser(HTMLParser):
           def __init__(self): super().__init__(); self.scripts=[]; self.fields=[]; self.forms=[]
           def handle_starttag(self,tag,attrs):
            a=dict(attrs)
            if tag=='script' and a.get('src'): self.scripts.append(a['src'])
            if tag=='form': self.forms.append({k:a.get(k) for k in ['action','method','id']})
            if tag in ['input','select','button']: self.fields.append({k:a.get(k) for k in ['name','id','type']})
          def get(url):
           req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript'})
           with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.geturl(),r.read(3000000).decode('utf-8',errors='replace')
          def inspect(item):
           name,url=item
           try:
            status,final,html=get(url); p=Parser(); p.feed(html)
            report={'airline':name,'status':status,'url':final,'forms':p.forms,'fields':p.fields,'scripts':p.scripts}
            print(json.dumps(report))
            html=re.sub(r'(?is)<input[^>]*type=["\x27]hidden["\x27][^>]*>','<!-- hidden input redacted -->',html)
            html=re.sub(r'(?i)(token|sessionid|session_id)\s*[:=]\s*["\x27][^"\x27]+["\x27]',r'\1="[redacted]"',html)
            (root/(name+'.html')).write_text(html)
            for i,src in enumerate(p.scripts):
             full=urllib.parse.urljoin(final,src)
             if urllib.parse.urlsplit(full).hostname!=urllib.parse.urlsplit(final).hostname: continue
             try:
              _,_,js=get(full);(root/(name+'-'+str(i)+'.js')).write_text(js)
             except Exception as e: print(name,'script error',full,type(e).__name__)
           except Exception as e: print(json.dumps({'airline':name,'error':str(e)}))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: list(pool.map(inspect,sources.items()))
          
          PY
      - name: Save public source inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: airline-source-inspection
          path: source-inspection
          retention-days: 1
