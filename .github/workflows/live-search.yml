name: Verify Next.js flight search
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Build the browser container and verify actual airline fares
        type: boolean
        default: false
permissions:
  contents: read
env:
  CLOAKBROWSER_VERSION: 146.0.7680.177.5
  CLOAKBROWSER_AUTO_UPDATE: 'false'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: |
          npx playwright-core install-deps chromium
          npm run browser:install
      - run: npm run test:e2e
      - name: Build production container
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: docker build -f Dockerfile.vercel -t rihla-next .
      - name: Verify actual airline fares
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: |
          docker run -d --name rihla-next -p 3000:3000 rihla-next
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          npm run test:live
      - name: Container logs on failure
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.live
        run: docker logs rihla-next || true
      - name: Stop container
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live
        run: docker rm -f rihla-next || true
